<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500" role="img" aria-labelledby="title desc">
  <title id="title">BiteHarbor offline demo</title>
  <desc id="desc">Terminal showing menu filtering and an authorized order lookup.</desc>
  <rect width="1080" height="500" rx="18" fill="#101418"/>
  <rect width="1080" height="52" rx="18" fill="#20262d"/>
  <circle cx="28" cy="26" r="8" fill="#ff5f57"/><circle cx="54" cy="26" r="8" fill="#febc2e"/><circle cx="80" cy="26" r="8" fill="#28c840"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">
    <text x="28" y="94" fill="#71d5c2">$ biteharbor --demo --customer demo-priya</text>
    <text x="28" y="132" fill="#e6edf3">BiteHarbor | synthetic data | OFFLINE DEMO</text>
    <text x="28" y="170" fill="#9aa7b2">Commands: reset, quit. During an order prompt: cancel.</text>
    <text x="28" y="224" fill="#71d5c2">You: Indian food under 300</text>
    <text x="28" y="262" fill="#e6edf3">BiteHarbor: Paneer Tikka — INR 199 [M06]</text>
    <text x="28" y="298" fill="#e6edf3">Mango Lassi — INR 99 [M08]</text>
    <text x="28" y="352" fill="#71d5c2">You: Track order ORD-201</text>
    <text x="28" y="390" fill="#e6edf3">BiteHarbor: ORD-201: Butter Chicken — Out for Delivery.</text>
    <text x="28" y="426" fill="#e6edf3">Estimate: Within 25 mins. Synthetic demonstration data.</text>
  </g>
</svg>
