[project]
name = "biteharbor-langgraph-food-assistant"
version = "0.1.0"
description = "Grounded menu discovery and customer-scoped order support with LangGraph"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sreenath Tella" }]
keywords = ["ai-agents", "langgraph", "rag", "customer-support", "chroma"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "fastapi>=0.117.1,<1",
  "langchain-core>=1,<2",
  "langgraph>=1.0,<2",
  "pydantic-settings>=2.10,<3",
]

[project.optional-dependencies]
live = [
  "langchain-chroma>=1,<2",
  "langchain-openai>=1,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
]

[project.urls]
Repository = "https://github.com/tellanad/biteharbor-langgraph-food-assistant"
Issues = "https://github.com/tellanad/biteharbor-langgraph-food-assistant/issues"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project.scripts]
biteharbor = "biteharbor.main:main"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "langchain-chroma>=1,<2",
  "langchain-openai>=1,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
  "uvicorn>=0.38,<1",
]

[tool.vercel]
entrypoint = "app:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=biteharbor --cov-report=term-missing"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel]
packages = ["src/biteharbor"]
